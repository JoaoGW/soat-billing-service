apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Ambiente efêmero do pipeline: cluster kind criado no runner, sem Azure.
namespace: soat-kind
resources:
  - ../../base
  - postgres.yaml
  - migration-job.yaml
patches:
  - target:
      kind: Deployment
      name: soat-billing-service
    patch: |-
      - op: remove
        path: /spec/template/spec/imagePullSecrets
      - op: remove
        path: /spec/template/metadata/labels/azure.workload.identity~1use
  - target:
      kind: ServiceAccount
      name: soat-billing-service
    patch: |-
      - op: remove
        path: /metadata/annotations
