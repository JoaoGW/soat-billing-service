name: CI
on:
  pull_request:
  push:
    branches: [main, development]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run build
      - run: npm run test:observability-local
      - run: npm run test:cov -- --watchman=false
      - run: npm run test:coverage-infrastructure -- --watchman=false
      - run: npm run test:contracts
      - run: kubectl kustomize deploy/kustomize/overlays/hml > /tmp/service-hml.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: billing-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: billing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d billing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/billing_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run test:integration
